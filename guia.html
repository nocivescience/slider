<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider simple</title>
  <style>
    .slider {
      width: 400px;
      height: 250px;
      margin: auto;
      overflow: hidden;
      position: relative;
      border: 2px solid #333;
      border-radius: 10px;
    }

    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slides img {
      width: 400px;
      height: 250px;
      object-fit: cover;
    }

    .buttons {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
    }

    button {
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="slides">
      <img src="https://picsum.photos/id/1015/400/250" alt="1">
      <img src="https://picsum.photos/id/1016/400/250" alt="2">
      <img src="https://picsum.photos/id/1018/400/250" alt="3">
      <img src="https://picsum.photos/id/1020/400/250" alt="4">
    </div>
    <div class="buttons">
      <button id="prev">&#10094;</button>
      <button id="next">&#10095;</button>
    </div>
  </div>

  <script>
    const slides = document.querySelector('.slides');
    const images = document.querySelectorAll('.slides img');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let index = 0;

    function showSlide() {
      slides.style.transform = `translateX(${-index * 400}px)`;
    }

    nextBtn.addEventListener('click', () => {
      index = (index + 1) % images.length;
      showSlide();
    });

    prevBtn.addEventListener('click', () => {
      index = (index - 1 + images.length) % images.length;
      showSlide();
    });
  </script>
</body>
</html>
