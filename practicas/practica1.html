<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .card{
        width: 170px;
        height: 200px;
    }
    img{
        width: 100%;
        height: 100%;
    }
    .movimiento{
        transform: translateX(12px);
        transition: transform 1s ease-in-out;
    }
</style>
<body>
    <div class="container">
        <div class="card"><img src="../imgs/1.png" alt=""></div>
        <div class="card"><img src="../imgs/2.png" alt=""></div>
        <div class="card"><img src="../imgs/3.png" alt=""></div>
        <div class="card"><img src="../imgs/4.png" alt=""></div>
        <div class="card"><img src="../imgs/5.png" alt=""></div>
    </div>
    <script>
        const containerEl = document.querySelector('.container');
        const cards= Array.from(document.querySelectorAll('.card'));
        let indice=1;
        containerEl.addEventListener('click', ()=>{
            containerEl.style.transform= `translateX(${indice*10}px)`;
            containerEl.style.transition = 'transform 1s ease'
            indice++;
        })
        cards.forEach((card, i)=>{
            card.addEventListener('click', ()=>{
                card.style.cssText=`
                    transform : translateX(${indice*5}px);
                    transition : transform 2s ease-in-out;
                `;
                indice+=5;
            })
        })
    </script>
</body>
</html>
