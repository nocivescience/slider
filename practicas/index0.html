<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider</title>
</head>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }
  img {
    width: 500px;
    height: 300px;
    object-fit: cover;
  }
  .slider {
    overflow: hidden;
    width: 500px;
    height: 300px;
    position: relative; /* importante para los botones */
  }
  .slides {
    display: flex;
    transition: transform 0.5s ease-in-out;
  }
  .slides img {
    width: 500px;
    height: 300px;
    object-fit: cover;
  }
  .buttons {
    position: absolute;
    top: 50%;
    width: 100%;
    display: flex;
    justify-content: space-between;
    transform: translateY(-50%);
    padding: 0 10px;
  }
  .buttons button {
    background: rgba(0,0,0,0.5);
    border: none;
    color: white;
    font-size: 2rem;
    cursor: pointer;
    border-radius: 50%;
    width: 50px;
    height: 50px;
  }
</style>
<body>
  <div class="slider">
    <div class="slides">
      <img src="./imgs/1.png" alt="farnaz1">
      <img src="./imgs/2.png" alt="farnaz2">
      <img src="./imgs/3.png" alt="farnaz3">
      <img src="./imgs/4.png" alt="farnaz4">
      <img src="./imgs/5.png" alt="farnaz5">
    </div>
    <div class="buttons">
      <button id="prev">&#10094;</button>
      <button id="next">&#10095;</button>
    </div>
  </div>

  <script>
    const slides = document.querySelector('.slides');
    const images = document.querySelectorAll('.slides img');
    const prevButton = document.getElementById('prev');
    const nextButton = document.getElementById('next');

    let currentIndex = 0;
    const imageWidth = 500; // ancho fijo de cada imagen

    function showSlide() {
      slides.style.transform = `translateX(${-currentIndex * imageWidth}px)`;
    }

    prevButton.addEventListener('click', () => {
      currentIndex = (currentIndex > 0) ? currentIndex - 1 : images.length - 1;
      showSlide();
    });

    nextButton.addEventListener('click', () => {
      currentIndex = (currentIndex < images.length - 1) ? currentIndex + 1 : 0;
      showSlide();
    });
  </script>
</body>
</html>
