<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
    }
    img {
        width: 500px;
        height: 300px;
        object-fit: cover;
    }
    .slider {
        overflow: hidden;
        width: 500px;
        height: 300px;
        position: relative;
    }
    .slides {
        display: flex;
        transition: transform 0.5s ease-in-out;
    }
    .slides img {
        width: 500px;
        height: 300px;
        object-fit: cover;
    }
    .buttons {
        position: absolute;
        top: 50%;
        width: 100%;
        display: flex;
        justify-content: space-between;
        transform: translateY(-50%);
    }
</style>
<body>
    <div class="slider">
        <div class="slides">
            <img src="./imgs/1.png" alt="farnaz1">
            <img src="./imgs/2.png" alt="farnaz2">
            <img src="./imgs/3.png" alt="farnaz3">
            <img src="./imgs/4.png" alt="farnaz4">
            <img src="./imgs/5.png" alt="farnaz5">
        </div>
        <div class="buttons">
            <button id="prev">&#10094;</button>
            <button id="next">&#10095;</button>
        </div>
    </div>
    <script>
        const slides = document.querySelector('.slides');
        const slider = document.querySelector('.slider');
        const images = document.querySelectorAll('.slides img');
        const prevButton = document.getElementById('prev');
        const nextButton = document.getElementById('next');

        let currentIndex = 0;

        function showSlide(){
            slides.style.transform = `translateX(${-currentIndex * 500}px)`;
            }
        prevButton.addEventListener('click', () => {
            currentIndex = (currentIndex-1 + images.length) % images.length;
            showSlide();
        });
        nextButton.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % images.length;
            showSlide();
        });
    </script>
</body>
</html>
